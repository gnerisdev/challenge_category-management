services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app_laravel
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: challenge_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
    depends_on:
      - db

  nginx:
    image: nginx:1.25
    container_name: app_nginx
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: app_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: challenge_db
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  app_node_build:
    build:
      context: ./src
      dockerfile: ../docker/node/Dockerfile.prod
    container_name: app_node_build
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - /var/www/html/node_modules
    command: sh -c "npm install && npm run build:prod && echo 'Build completed successfully'"
    profiles:
      - build

volumes:
  db_data_prod:

