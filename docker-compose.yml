services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app_laravel
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: challenge_db
      DB_USERNAME: root
      DB_PASSWORD: root
    depends_on:
      - db

  nginx:
    image: nginx:1.25
    container_name: app_nginx
    ports:
      - "9000:80"
    volumes:
      - ./src:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: app_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: challenge_db
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

  node:
    image: node:20
    container_name: app_node
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    command: ["npm", "run", "dev"]
    depends_on:
      - app

volumes:
  db_data:
